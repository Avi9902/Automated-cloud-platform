apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-worker
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: platform-worker
  template:
    metadata:
      labels:
        app: platform-worker
    spec:
      containers:
        - name: worker
          image: platform-worker:dev
          imagePullPolicy: Never
          env:
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
            - name: QUEUE_NAME
              value: platform-jobs
