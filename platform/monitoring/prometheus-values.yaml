
server:
  persistentVolume:
    enabled: false

serverFiles:
  prometheus.yml:
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets:
              - localhost:9090

      - job_name: platform-api
        metrics_path: /metrics
        static_configs:
          - targets:
              - platform-api.default.svc.cluster.local:8080
