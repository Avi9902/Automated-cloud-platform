server:
  persistentVolume:
    enabled: false
  extraFlags:
    - web.enable-lifecycle

scrapeConfigs:
  prometheus:
    enabled: true
    static_configs:
      - targets:
          - localhost:9090
  platform-api:
    enabled: true
    job_name: platform-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - platform-api.default.svc.cluster.local:8080

serverFiles:
  prometheus.yml:
    rule_files:
      - /etc/config/recording_rules.yml
      - /etc/config/alerting_rules.yml
      - /etc/config/rules
      - /etc/config/alerts
