{{- if .Values.worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "blackbox-platform.fullname" . }}-worker
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: cloud-agnostic-platform
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      app: platform-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: platform-worker
        app.kubernetes.io/part-of: cloud-agnostic-platform
    spec:
      terminationGracePeriodSeconds: {{ .Values.workerTerminationGracePeriodSeconds }}
      containers:
        - name: worker
          image: "{{ required "worker.image.repository must be set" .Values.worker.image.repository }}:{{ required "worker.image.tag must be set" .Values.worker.image.tag }}"
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          env:
            {{- range $name, $value := .Values.worker.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
{{- end }}
