nameOverride: ""
fullnameOverride: "platform"

api:
  enabled: true
  replicaCount: 1
  image:
    repository: platform-api
    tag: dev
    pullPolicy: Never
  containerPort: 8080
  env:
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

worker:
  enabled: true
  replicaCount: 1
  image:
    repository: platform-worker
    tag: reliable
    pullPolicy: Never
  env:
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    QUEUE_NAME: platform-jobs
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

service:
  type: ClusterIP

apiTerminationGracePeriodSeconds: 75
workerTerminationGracePeriodSeconds: 75

podDisruptionBudget:
  api:
    enabled: false
    minAvailable: 1
  worker:
    enabled: false
    minAvailable: 1

autoscaling:
  api:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  worker:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
