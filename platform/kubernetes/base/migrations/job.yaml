apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-migrations
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app: postgres-migrations
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: platform-db-migrations:dev
          imagePullPolicy: Never
          env:
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: platform
            - name: POSTGRES_USER
              value: platform
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-auth
                  key: POSTGRES_PASSWORD
